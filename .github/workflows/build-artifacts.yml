name: Build Artifacts

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - "release/**"
      - "version/**"
  push:
    branches:
      - main
      - "release/**"
      - "version/**"
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-latest
          - platform: windows
            runner: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux packages
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libjack-jackd2-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            pkg-config \
            zip

      - name: Install macOS packages
        if: matrix.platform == 'macos'
        shell: zsh {0}
        run: |
          brew install cmake zip

      - name: Show tool versions
        shell: bash
        run: |
          cmake --version
          git --version

      - name: Build Linux VST3
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          chmod +x scripts/build-linux.sh
          TARGET=ohmsick_plugin_VST3 ./scripts/build-linux.sh
          cmake --build build-linux --target hardware_parser_tests --parallel "$(nproc)"
          ./build-linux/hardware_parser_tests

      - name: Build macOS VST3/AU
        if: matrix.platform == 'macos'
        shell: zsh {0}
        run: |
          chmod +x scripts/build-macos.zsh
          ./scripts/build-macos.zsh
          ./build-macos/hardware_parser_tests

      - name: Build Windows VST3
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $cmakeHelp = cmake --help
          if ($cmakeHelp -match "Visual Studio 18 2026") {
            $generator = "Visual Studio 18 2026"
          } elseif ($cmakeHelp -match "Visual Studio 17 2022") {
            $generator = "Visual Studio 17 2022"
          } else {
            throw "No supported Visual Studio CMake generator was found on this runner."
          }
          ./scripts/build-windows.ps1 -Generator $generator -Target ohmsick_plugin_VST3
          cmake --build build-windows --config Release --target hardware_parser_tests
          ./build-windows/Release/hardware_parser_tests.exe

      - name: Package Linux artifacts
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          vst3_path="$(find build-linux -type d -path '*/VST3/Ohmsick.vst3' -print -quit)"
          if [[ -z "$vst3_path" ]]; then
            echo "Could not find Linux Ohmsick.vst3 under build-linux."
            find build-linux -maxdepth 5 -type d -name '*artefacts' -print
            exit 1
          fi
          parent_dir="$(dirname "$vst3_path")"
          (cd "$parent_dir" && zip -r "$GITHUB_WORKSPACE/dist/ohmsick-linux-vst3.zip" "Ohmsick.vst3")
          ls -la dist

      - name: Package macOS artifacts
        if: matrix.platform == 'macos'
        shell: zsh {0}
        run: |
          mkdir -p dist
          vst3_path="$(find build-macos -type d -path '*/VST3/Ohmsick.vst3' -print -quit)"
          au_path="$(find build-macos -type d -path '*/AU/Ohmsick.component' -print -quit)"

          if [[ -n "$vst3_path" ]]; then
            ditto -c -k --keepParent \
              "$vst3_path" \
              "dist/ohmsick-macos-vst3.zip"
          fi

          if [[ -n "$au_path" ]]; then
            ditto -c -k --keepParent \
              "$au_path" \
              "dist/ohmsick-macos-au.zip"
          fi

          if ! ls dist/*.zip >/dev/null 2>&1; then
            echo "Could not find macOS plugin artifacts under build-macos."
            find build-macos -maxdepth 5 -type d -name '*artefacts' -print
            exit 1
          fi

          ls -la dist

      - name: Package Windows artifacts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $vst3Path = Get-ChildItem -Path build-windows -Directory -Recurse -Filter "Ohmsick.vst3" |
            Where-Object { $_.FullName -match "\\VST3\\Ohmsick\.vst3$" } |
            Select-Object -First 1

          if ($null -eq $vst3Path) {
            Write-Host "Could not find Windows Ohmsick.vst3 under build-windows."
            Get-ChildItem -Path build-windows -Directory -Recurse -Filter "*artefacts" | Select-Object FullName
            exit 1
          }

          Compress-Archive `
            -Path $vst3Path.FullName `
            -DestinationPath "dist/ohmsick-windows-vst3.zip" `
            -Force
          Get-ChildItem dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ohmsick-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ohmsick-*
          path: dist
          merge-multiple: true

      - name: Show release assets
        shell: bash
        run: ls -la dist

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/*.zip --clobber
          else
            gh release create "$TAG_NAME" dist/*.zip \
              --verify-tag \
              --title "$TAG_NAME" \
              --generate-notes
          fi
